name: Ensure Formatting

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ensure-formatting:
    runs-on: ubuntu-latest
    permissions:
      # Enforce least-privilege token access for read-only validation
      contents: read
    steps:
      - name: Checkout repository
        # Pinned to commit SHA to mitigate third-party action tampering
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          # Prevent persisting repository auth token in the workspace
          persist-credentials: false

      - name: Use Node.js 16
        # Pinned to commit SHA to mitigate third-party action tampering (SHA points upstream to v3.9.1)
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 16
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run validation script
        run: node ./ci.js